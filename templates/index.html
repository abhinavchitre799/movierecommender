<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Movie Recommendation Agent</title>
  <style>
    :root {
      --bg: #0a0f1c;
      --panel: #0f172a;
      --card: #111827;
      --border: #1f2937;
      --accent: #22c55e;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --highlight: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 20% 20%, rgba(46, 71, 148, 0.12), transparent 40%), radial-gradient(circle at 80% 60%, rgba(34, 197, 94, 0.14), transparent 40%), var(--bg);
      font-family: "Segoe UI", sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .layout {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      height: 75vh;
      display: flex;
      flex-direction: column;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
      letter-spacing: 0.2px;
    }
    .user-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .user-row {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      cursor: pointer;
      transition: border 0.12s ease, transform 0.12s ease;
    }
    .user-row:hover {
      border-color: var(--highlight);
      transform: translateY(-1px);
    }
    .user-row.active {
      border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(34, 197, 94, 0.25);
    }
    .user-label {
      font-weight: 600;
      font-size: 14px;
    }
    .user-desc {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }
    .chat-shell {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 75vh;
    }
    .chat-header {
      padding: 16px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.2px;
    }
    .status {
      color: var(--muted);
      font-size: 13px;
    }
    .chat-window {
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: radial-gradient(circle at 15% 25%, rgba(46, 71, 148, 0.1), transparent 45%),
                  radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.1), transparent 40%),
                  var(--panel);
    }
    .bubble {
      padding: 12px 14px;
      border-radius: 14px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bot-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .badge {
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.16);
      color: #bbf7d0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .subtle {
      color: var(--muted);
      font-size: 13px;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .movie-card {
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.7);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .movie-title {
      font-weight: 600;
      font-size: 14px;
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.18);
      color: var(--muted);
      font-size: 11px;
    }
    .why {
      color: var(--muted);
      font-size: 12px;
    }
    .card-actions {
      margin-top: 4px;
      display: flex;
      gap: 8px;
    }
    .card-actions button {
      flex: 1;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .card-actions button.primary {
      background: var(--accent);
      color: #0b1220;
      border-color: transparent;
      font-weight: 600;
    }
    .cta {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .inline-confirm {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(34, 197, 94, 0.12);
      color: #bbf7d0;
      font-size: 12px;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: var(--text);
    }
    .bot {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .system {
      align-self: center;
      background: rgba(148, 163, 184, 0.16);
      color: var(--muted);
      font-size: 13px;
    }
    .controls {
      padding: 16px 20px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }
    .controls input, .controls button {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }
    .controls button {
      background: var(--accent);
      color: #0b1220;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .controls button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
    }
    @media (max-width: 960px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .panel, .chat-shell {
        height: auto;
      }
    }
    @media (max-width: 640px) {
      .bubble { max-width: 100%; }
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <h2>Select a user</h2>
      <div id="userList" class="user-list"></div>
      <p class="status" id="activeUserStatus">No user selected.</p>
    </aside>

    <div class="chat-shell">
      <div class="chat-header">
        <h1>AI Movie Guide</h1>
        <span class="status">Strategy-aware recommendations</span>
      </div>
      <div id="chatWindow" class="chat-window"></div>
      <form id="chatForm" class="controls">
        <input type="text" id="message" name="message" placeholder="Ask for a vibe or tweak the list (optional)" />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    const chatWindow = document.getElementById("chatWindow");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("message");
    const userList = document.getElementById("userList");
    const activeUserStatus = document.getElementById("activeUserStatus");

    const users = [
      { id: "user1", label: "User 1", desc: "Heavy suspense/thriller fan; nearly cleared the suspense catalog." },
      { id: "user2", label: "User 2", desc: "Romance + comedy lover with a dash of drama." },
      { id: "user3", label: "User 3", desc: "Mixed tastes: suspense, sci-fi, and drama blends." },
    ];

    let selectedUserId = null;
    const strategyLabels = {
      cold_start: {
        label: "Exploring your taste",
        desc: "Starting with a broad mix to learn what you like.",
      },
      content_based: {
        label: "Based on what you’ve liked",
        desc: "Picked from your recent choices and watch history.",
      },
      content_based_weak: {
        label: "Getting to know your taste",
        desc: "Using early signals with a little variety.",
      },
      adjacent_genres_exploration: {
        label: "Expanding nearby genres",
        desc: "Trying close neighbors to your favorite styles.",
      },
    };

    users.forEach((user) => {
      const row = document.createElement("div");
      row.className = "user-row";
      row.dataset.userId = user.id;
      row.innerHTML = `
        <div class="user-label">${user.label}</div>
        <div class="user-desc">${user.desc}</div>
      `;
      row.addEventListener("click", () => handleUserSelect(user.id));
      userList.appendChild(row);
    });

    function handleUserSelect(userId) {
      if (selectedUserId === userId) return;
      selectedUserId = userId;
      document.querySelectorAll(".user-row").forEach((row) => {
        row.classList.toggle("active", row.dataset.userId === userId);
      });
      activeUserStatus.textContent = `Active user: ${userId}`;
      clearChat();
      addBubble(`Selected ${userId}. Fetching tailored picks...`, "system");
      sendChat("Show me recommendations", { skipUserBubble: true });
    }

    function addBubble(text, type = "bot") {
      const div = document.createElement("div");
      div.className = `bubble ${type}`;
      div.textContent = text;
      chatWindow.appendChild(div);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return div;
    }

    function addThinking() {
      return addBubble("Thinking...", "bot");
    }

    function clearChat() {
      chatWindow.innerHTML = "";
    }

    function renderRecommendations(data) {
      const bubble = document.createElement("div");
      bubble.className = "bubble bot";
      const strategyKey = (data.decision?.strategy || data.strategy || "").toLowerCase();
      const meta = strategyLabels[strategyKey] || {
        label: "Here are some picks",
        desc: "A few ideas based on your current context.",
      };
      bubble.innerHTML = `
        <div class="bot-header">
          <span class="badge">${meta.label}</span>
          <span class="subtle">${meta.desc}</span>
        </div>
        <div class="card-grid"></div>
        <div class="cta">Pick a movie to refine the list.</div>
      `;
      const grid = bubble.querySelector(".card-grid");
      const recs = Array.isArray(data.recommendations) ? data.recommendations : [];
      if (!recs.length) {
        const empty = document.createElement("div");
        empty.className = "movie-card";
        empty.innerHTML = `
          <div class="movie-title">Nothing strong yet.</div>
          <div class="why">Try a broader mix or tell me a mood.</div>
          <div class="card-actions">
            <button class="primary" data-action="refresh">Show a mix</button>
          </div>
        `;
        grid.appendChild(empty);
      } else {
        recs.forEach((movie) => {
          const card = document.createElement("div");
          card.className = "movie-card";
          const genres = (movie.genres || []).map((g) => `<span class="tag">${g}</span>`).join("");
          const why = movie.genres?.[0] ? `Matches your ${movie.genres[0]} streak.` : "A close match to your recent picks.";
          card.innerHTML = `
            <div class="movie-title">${movie.title}</div>
            <div class="tag-row">${genres}</div>
            <div class="why">${why}</div>
            <div class="card-actions">
              <button class="primary" data-action="pick" data-title="${movie.title}">Pick this</button>
              <button data-action="skip" data-title="${movie.title}">Not for me</button>
            </div>
          `;
          grid.appendChild(card);
        });
      }
      bubble.addEventListener("click", (event) => {
        const btn = event.target.closest("button");
        if (!btn) return;
        const action = btn.dataset.action;
        const title = btn.dataset.title;
        if (action === "pick" && title) {
          addBubble(`Picked: ${title}`, "user");
          addBubble("Saved — refining your taste.", "system");
          sendChat(title, { skipUserBubble: true });
        } else if (action === "skip") {
          addBubble("Not for me.", "user");
          sendChat("none", { skipUserBubble: true });
        } else if (action === "refresh") {
          sendChat("Show me recommendations", { skipUserBubble: true });
        }
      });
      chatWindow.appendChild(bubble);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendChat(message, options = {}) {
      const { skipUserBubble = false } = options;
      if (!selectedUserId) {
        addBubble("Pick a user from the table first.", "bot");
        return;
      }
      const text = (message || "").trim() || "Show me recommendations";
      if (!skipUserBubble) addBubble(text, "user");
      const thinking = addThinking();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: selectedUserId, message: text }),
        });
        const data = await res.json();
        thinking.remove();
        renderRecommendations(data);
      } catch (err) {
        thinking.remove();
        addBubble("Something went wrong. Please try again.", "bot");
        console.error(err);
      }
    }

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = messageInput.value;
      messageInput.value = "";
      sendChat(message);
    });
  </script>
</body>
</html>
